# Validation configuration: calendar year 2024, 12 monthly periods. It is a
# deliberately narrow cloud-service validation case, not a portfolio sweep.
# Calibration anchor: Microsoft’s internal support deployment reported a 12%
# reduction in case-handling time among several teams (Microsoft WorkLab, 2024,
# “A Year with Copilot”, paragraph beginning “The investment has paid off”).
# Provisioning anchor: Klarna’s February 2024 OpenAI case study reports an
# OpenAI-powered customer-service assistant and ChatGPT Enterprise for all
# employees; no local-model purchase or CAPEX is disclosed. Accordingly this
# file keeps only cloud_api_only and zero local CAPEX. Evidence note:
# docs/VALIDATION_EVIDENCE_2024_2025.md.
# All numeric inputs are deliberately editable scenario assumptions. References:
# Rogers (2003), ch. 1; Brynjolfsson, Li & Raymond (2023), Table 3;
# Noy & Zhang (2023), Results; Paradis et al. (2024), Table 2; Becker et al.
# (2025), abstract; Dell'Acqua et al. (2023), Results. Full links are README.md
# "Source Anchors". Values without a direct estimate are marked illustrative.
model:
  personas: # Adoption archetypes; shares are fractions of employees [0,1]. Rogers (2003), ch. 7; suggested canonical split below.
    - {persona: innovators, share: 0.025, adoption_mean: 0.93, usage_intensity: 1.35, wait_tolerance: 0.85, effort_expectancy_beta: 0.00, adaptability_index: 1.20} # Unitless moderation inputs; see simulation_config.yaml for calibration basis and ranges.
    - {persona: early_adopters, share: 0.135, adoption_mean: 0.82, usage_intensity: 1.20, wait_tolerance: 0.72, effort_expectancy_beta: 0.15, adaptability_index: 0.10} # Unitless moderation inputs; see simulation_config.yaml for calibration basis and ranges.
    - {persona: early_majority, share: 0.34, adoption_mean: 0.61, usage_intensity: 1.00, wait_tolerance: 0.55, effort_expectancy_beta: 0.375, adaptability_index: 0.00} # Unitless early-majority calibration reference; see simulation_config.yaml.
    - {persona: late_majority, share: 0.34, adoption_mean: 0.38, usage_intensity: 0.78, wait_tolerance: 0.36, effort_expectancy_beta: 0.45, adaptability_index: -0.05} # Unitless illustrative moderation inputs; see simulation_config.yaml.
    - {persona: laggards, share: 0.16, adoption_mean: 0.17, usage_intensity: 0.48, wait_tolerance: 0.18, effort_expectancy_beta: 0.45, adaptability_index: -0.10} # Unitless illustrative moderation inputs; see simulation_config.yaml.
  employee_types: # Work mix and annual paid-AI gain distribution; gains/sigma are fractions/year. See cited results above; suggested sensitivity spans the observed task-specific evidence.
    # frontier_quality_work_share is the share of this task that needs frontier-grade
    # model quality. For eligible local models it receives full frontier capability;
    # the remainder receives onprem_capability_multiplier instead. It is a workload
    # composition assumption (unit: fraction [0,1]), not a benchmark score. The
    # project derives the larger-model premise from the Gemma model card; see
    # docs/HARDWARE_BENCHMARKS.md, “Model-quality adjustment”. Use task audits; vary 0-1.
    - {task: software_engineering, share: 0.0, mean_gain: 0.10, sigma: 0.060, capability_fit: 0.85, frontier_quality_work_share: 0.55} # Excluded from this support-work validation.
    - {task: administration, share: 1.0, mean_gain: 0.12, sigma: 0.060, capability_fit: 1.00, frontier_quality_work_share: 0.70} # 12%/year calibration: Microsoft WorkLab 2024 support-agent case-handling-time result; task-specific, not firm-wide.
    - {task: creative_work, share: 0.0, mean_gain: 0.10, sigma: 0.120, capability_fit: 0.90, frontier_quality_work_share: 0.70} # Excluded from this support-work validation.
    - {task: manual_labor, share: 0.0, mean_gain: 0.020, sigma: 0.020, capability_fit: 0.25, frontier_quality_work_share: 0.15} # Excluded from this support-work validation.
    - {task: knowledge_work, share: 0.0, mean_gain: 0.15, sigma: 0.090, capability_fit: 0.90, frontier_quality_work_share: 0.60} # Excluded from this support-work validation.
  # Multiplies only software_engineering.mean_gain; it does not change adoption,
  # cost, or the other work types. Thus bounded: 2 turns a 10%/year base gain
  # into 20%/year, while maintenance: -0.25 turns it into -2.5%/year. Unitless.
  # Paradis et al. (2024), Table 2, estimates ~21% time saving in bounded work;
  # Becker et al. (2025), abstract, reports a 19% slowdown in mature OSS work.
  engineering_context_multipliers: # Suggested multiplier range -1.9 to 2.5; select the context rather than averaging unlike work.
    mixed: 1.0 # unitless multiplier; baseline 1; suggested [0,2].
    bounded: 2.0 # unitless; maps 10% to 20%/yr, near Paradis; suggested [1,2.5].
    maintenance: -0.25 # unitless; maps 10% to -2.5%/yr, conservative versus Becker -19%; suggested [-1.9,0].
  dynamics: # Stylized capability and price paths; no paper identifies these rates, so treat as sensitivity inputs.
    frontier_quarterly_growth: 1.085 # capability multiplier/quarter; illustrative; suggested 1.00-1.20.
    frontier_capability_max: 2.60 # capability multiplier; illustrative ceiling; suggested 1.0-4.0.
    gradual_token_cost_increase: 0.85 # fractional total increase over horizon; scenario assumption; suggested 0-1.
    sudden_token_cost_multiplier: 1.85 # post-shock cost multiplier; scenario assumption; suggested 1-3.
  scenarios:
    frontier_growth: {kind: frontier, growth: true, lag_months: 0} # Cloud frontier reference; the only validation model path.
  shock_scenarios: [] # scenario labels; no physical unit.
  service_providers:
    # confidential_capacity_share is the fraction of confidential requested work
    # that can be routed to this provider. The remainder must use the local fallback
    # or remains unserved; it is not a share of total provider capacity. Unit:
    # fraction [0,1]. This is a security/contract policy assumption, with no
    # universal literature value; set from the data-classification and DPA rules.
    global_service: {capability_lag_months: 0, embargo_affected: true, confidential_capacity_share: 0.0} # lag months, eligibility fraction; illustrative; ranges 0-12 months, 0-1.
    european_service: {capability_lag_months: 9, embargo_affected: false, confidential_capacity_share: 1.0} # lag months, eligibility fraction; illustrative; ranges 0-12, 0-1.
    local_hardware: {capability_lag_months: 0, embargo_affected: false, confidential_capacity_share: 0.0} # lag months, eligibility fraction; illustrative; ranges 0-12, 0-1.
    eu_cloud_oss: {capability_lag_months: 0, embargo_affected: false, confidential_capacity_share: 0.5} # lag months, eligibility fraction; illustrative; ranges 0-12, 0-1.
  token_scenarios: {flat: flat} # Hold pricing constant: published case studies do not disclose monthly token prices.
  access_plans:
    pay_per_use: {subscription_cost_per_active_user_quarter: 0.0, five_hour_allowance: .inf, weekly_allowance: .inf, topup: false} # cost-index/user-quarter, allowance fraction; provider-contract inputs; use quoted prices/limits.
  local_fallback_policies: [persona_choice, local_default] # policy labels; scenario choices.
  hardware_scenarios:
    # capex_units is a relative upfront-CAPEX index used for compatibility with
    # older index-budget inputs. When a USD hardware budget is supplied, purchase
    # costs from configs/hardware_benchmarks.csv determine affordability instead. Unit:
    # index units (not GPUs, USD, or concurrent users); it scales the default USD
    # index calibration. Values come from the project hardware methodology; do not
    # compare them to market prices directly.
    cloud_api_only: {capacity: 0.0, utilization: 1.0, capex_units: 0.0} # capacity/utilization fractions [0,1], capex index; cloud reference.
  hardware_refresh:
    # capability_bonus multiplies effective local capability after hardware capacity
    # has been funded. At 1.08, a fully funded refreshed system receives an 8%
    # quality uplift; an underfunded system receives a proportional uplift. It does
    # not add throughput. Unitless; illustrative sensitivity range 1.0-1.2.
    maxed_out: {refresh_factor: 1.0, capability_bonus: 1.0} # unitless; fixed hardware; suggested 1.
  hardware_calibrations: # USD/unit and capability assumptions; project hardware table dated 2026-07-14, docs/HARDWARE_BENCHMARKS.md.
    # frontier_quality_work_share_multiplier controls whether the task-specific
    # frontier_quality_work_share is eligible for frontier-level local capability.
    # 1 preserves that share; 0 makes all work use onprem_capability_multiplier.
    # Unitless fraction [0,1]. It is a model-quality sensitivity assumption based
    # on the Gemma model-card discussion in docs/HARDWARE_BENCHMARKS.md, not a measured
    # accuracy conversion; test 0 and 1 when local quality is uncertain.
    rtx6000-ada-gemma4-12b: {target_unit_usd: 8500.0, onprem_capability_multiplier: 0.88, frontier_quality_work_share_multiplier: 0.0, onprem_model_label: Gemma 4 12B local model} # USD, fractions [0,1]; update from vendor quote/benchmark.
    rtx6000-pro-gemma4-26b-moe: {target_unit_usd: 14500.0, onprem_capability_multiplier: 0.94, frontier_quality_work_share_multiplier: 1.0, onprem_model_label: Gemma 4 26B MoE local model} # same units/source.
    h100-gemma4-31b: {target_unit_usd: 380000.0, onprem_capability_multiplier: 0.97, frontier_quality_work_share_multiplier: 1.0, onprem_model_label: Gemma 4 31B local model} # same units/source.
    b200-gemma4-31b: {target_unit_usd: 750000.0, onprem_capability_multiplier: 0.97, frontier_quality_work_share_multiplier: 1.0, onprem_model_label: Gemma 4 31B local model} # same units/source.
costs:
  months_per_year: 12 # months/year; calendar definition; fixed.
  hardware_amortization_months: 36 # months; common three-year IT planning assumption; sensitivity 24-60 months.
  max_confidential_document_fraction: 0.90 # fraction [0,1]; scenario cap, not literature estimate; use organisation data.
  counterfactual_skill_growth_rate_per_year: 0.015 # fraction/year; illustrative; sensitivity 0-0.05.
  tvod_e12_step3_monthly_gross_eur: 5359.50 # EUR/month; TVöD Bund E12 Stufe 3, May 2026; update from official salary table.
  it_employer_cost_factor: 1.25 # unitless payroll uplift; illustrative; sensitivity 1.15-1.35.
  it_support_fte: 0.5 # FTE; illustrative small-company support; sensitivity 0-1 FTE.
simulation:
  users: 2500 # employees; nearest existing bracket to Klarna-scale validation; use as a size proxy, not a claim of Klarna headcount.
  years: 1.0 # years; January–December 2024.
  resolution_months: 1 # months/period; gives 12 monthly periods.
  runs: 1000 # Monte-Carlo runs; numerical precision, not literature; use >=100, preferably >=1000.
  seed: 2024 # integer PRNG seed; reproducibility only.
  plateau_quarter: 12 # monthly periods; no within-year plateau assumed for this validation.
  base_cost_index_per_active_user_quarter: 1.0 # cost-index/(active user quarter); normalization; use 1.
  confidential_document_fraction: 0.0 # fraction [0,1]; organisation data; suggested observed share.
  zero_risk_confidential_work_share: 0.20 # fraction [0,1]; illustrative eligibility; sensitivity 0-1.
  usd_per_service_cost_index_quarter: 60.0 # USD/(cost-index user-quarter); pricing input; update from contract.
  hardware_calibration: h100-gemma4-31b # calibration key; choose hardware table row.
  engineering_context: mixed # context label; see Paradis 2024 Table 2 and Becker 2025 abstract.
  adoption_propensity_concentration: 24.0 # beta concentration (unitless); illustrative; sensitivity 5-100.
  adoption_capability_elasticity: 0.16 # probability per capability-index unit; illustrative; sensitivity 0-0.5.
  effort_expectancy_friction: 0.20 # Unitless interface/effort friction [0,1]; UTAUT experience moderation scenario; sensitivity 0-0.5.
  adaptability_productivity_beta: 0.599 # Unitless standardized coefficient from user-supplied evidence; sensitivity 0.177-0.599.
  early_majority_effort_expectancy_beta: 0.375 # Unitless calibration anchor; midpoint of beta 0.30-0.45.
  early_majority_adaptability_index: 0.0 # Unitless calibration anchor; preserves early-majority output.
  improvement_base_probability: 0.42 # probability [0,1]; illustrative; Dell'Acqua 2023 motivates heterogeneity; sensitivity 0.1-0.8.
  improvement_capability_weight: 0.20 # probability per capability-fit unit; illustrative; sensitivity 0-0.5.
  improvement_probability_min: 0.05 # probability [0,1]; clipping prior; sensitivity 0-0.2.
  improvement_probability_max: 0.92 # probability [0,1]; clipping prior; sensitivity 0.8-1.
  ai_gain_min: -0.25 # fraction/period after scaling; Becker 2025 reports -19%; sensitivity -0.5-0.
  ai_gain_max: 2.0 # fraction/period after scaling; bound for tail sensitivity, not central estimate; sensitivity 0.4-2.
  zero_risk_feature_gain: 0.005 # fraction/year; illustrative embedded-AI gain; sensitivity 0-0.02.
  embargo_shock_probability: 0.05 # probability/period; scenario prior, no literature rate; sensitivity 0-0.2.
  # Extra capability lag applied only when an embargo shock is active and the
  # selected provider has embargo_affected: true. It shifts the provider back by
  # this many months on the frontier capability path; it does not interrupt
  # service, change price, or affect unaffected/local providers. Unit: months.
  # This is a geopolitical scenario assumption rather than an estimated frequency;
  # use 0 for no rollback and explore 0-24 months for stress tests.
  embargo_rollback_months: 6 # months; scenario assumption; suggested stress-test range 0-24.
  sudden_break_even_probability_per_month: 0.01 # probability/month; scenario prior; sensitivity 0-0.1.
  gradual_break_even_probability_per_month: 0.01 # probability/month; scenario prior; sensitivity 0-0.1.
  capability_plateau_probability_per_month: 0.01 # probability/month; scenario prior; sensitivity 0-0.1.
  confidential_mixing_ratio: 0.5 # fraction [0,1]; workflow-mixing assumption; use observed routing share.
  confidential_mixing_penalty: 0.5 # fractional gain penalty [0,1]; illustrative; sensitivity 0-1.
  it_support_max_users: 50 # employees; project IT-cost threshold; sensitivity 0-250.
sweeps:
  budget_frontier: {users: 500, years: 3.0, resolution_months: 3, runs: 200, concurrency: 4, simulation_concurrency: 1, seed: 20260707, plateau_quarter: 5, service_budget_min_usd: 0.0, service_budget_points: 5, hardware_budget_min_usd: 0.0, hardware_budget_points: 5} # units employees/years/months/runs/workers/USD/points; design settings, use budget-study requirements.
  portfolio:
    years: 3.0 # years; sweep horizon; suggested 1-5.
    resolution_months: 3 # months/period; suggested 1-3.
    runs: 100 # Monte-Carlo runs; numerical precision; use >=100.
    concurrency: 4 # worker processes; execution setting, use available cores.
    seed: 20260711 # integer PRNG seed; reproducibility only.
    headcounts: [5,25,50,100,500,2500] # employees; sensitivity grid, use target organizations.
    service_budgets_usd: [5.0,10.0,25.0,50.0] # USD/(employee month); contract sensitivity grid, use quotes.
    hardware_budgets_usd: [0.0,10000.0,50000.0,100000.0,500000.0,1000000.0] # USD upfront; capital-budget sensitivity grid.
    confidential_shares: [0.0,0.1,0.25,0.5,0.9] # fraction [0,1]; data/sensitivity grid.
    company_profiles: # Employee-share fractions; illustrative compositions, each must sum to 1.
      administration_heavy: {software_engineering: 0.05, administration: 0.70, manual_labor: 0.10, knowledge_work: 0.15, creative_work: 0.0} # fractions; organizational data preferred.
      mixed: {software_engineering: 0.25, administration: 0.35, manual_labor: 0.20, knowledge_work: 0.20, creative_work: 0.10} # fractions; original baseline; normalize before use with organization data.
      manual_labor_heavy: {software_engineering: 0.05, administration: 0.15, manual_labor: 0.70, knowledge_work: 0.10, creative_work: 0.0} # fractions; organizational data preferred.
      software_engineering_heavy: {software_engineering: 0.75, administration: 0.10, manual_labor: 0.05, knowledge_work: 0.10, creative_work: 0.0} # fractions; organizational data preferred.
      knowledge_worker_heavy: {software_engineering: 0.10, administration: 0.20, manual_labor: 0.05, knowledge_work: 0.65, creative_work: 0.0} # fractions; organizational data preferred.
      creative_worker_heavy: {software_engineering: 0.05, administration: 0.10, manual_labor: 0.05, knowledge_work: 0.10, creative_work: 0.70} # fractions; organizational data preferred.
